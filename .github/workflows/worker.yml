name: kalkikhoj-worker
on:
  schedule:
     - cron: "30 1,2 * * *"   # GitHub may delay scheduled runs by several minutes
  workflow_dispatch: {}

concurrency:
  group: kalkikhoj-worker
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # 1080p edit with ~100 shots and transitions takes roughly 30-60 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r worker/requirements.txt
      - name: Run worker
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}       # required: stock videos/photos
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # scene plan + thumbnail (optional but recommended)
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}             # optional override
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}   # optional
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}         # optional, comma-separated models to try in order
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}             # optional override
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE }}             # optional, e.g. Charon / Kore / Puck
          TTS_ENGINE: ${{ secrets.TTS_ENGINE }}                         # optional, "edge" to switch back
          PYTHONUNBUFFERED: "1"   # show log lines live instead of at the end
        run: python worker/render_upload.py
